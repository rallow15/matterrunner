# =====================================================================
#  codemagic.yaml — MatterRunner : build iOS SIMPLIFIÉ (sans Unity)
#
#  STRATÉGIE :
#    - le PROJET XCODE (build_xcode/) est généré PAR TON UNITY WINDOWS
#      (ton PC a déjà la licence Personal) puis poussé sur GitHub ;
#    - les Mac de Codemagic ne font PLUS qu'UNE chose : compiler ce
#      projet avec xcodebuild (aucun Unity, AUCUNE licence Unity).
#    - la .ipa sort NON SIGNÉE : tu la fais signer gratuitement par
#      ton Apple ID avec Sideloadly / AltStore sur ton PC, puis tu
#      l'installes sur ton iPhone.
#
#  Déclencheur : bouton "Start build" dans l'onglet Builds de Codemagic.
#  Aucune variable d'environnement nécessaire.
# =====================================================================

workflows:
  matterrunner-ios:
    name: "MatterRunner — Xcode → IPA non signée"
    instance_type: "mac_mini_m1"
    max_build_duration: 100

    environment:
      groups:
        - default
      vars:
        XCODE_DIR: "build_xcode"

    scripts:
      # --------------------------------------------------------------
      # 1) LFS : libiPhone-lib.a (219 Mo) est stockée via Git LFS —
      #    elle doit être "débloquée" après le clone.
      #    On liste ensuite les schémas RÉELS du projet Xcode.
      # --------------------------------------------------------------
      - name: "LFS + inventaire du projet Xcode"
        script: |
          set -e
          git lfs install || true
          git lfs pull || true
          # Windows (où le projet Xcode a été généré) ne stocke pas les
          # permissions Unix : les scripts shell d'Unity (process_symbols.sh,
          # validate-tbd.sh, usymtool…) perdent leur bit exécutable au
          # commit. On le remet ici, sinon "Permission denied" en plein
          # milieu du xcodebuild.
          find "$XCODE_DIR" -type f \( -name "*.sh" -o -name "usymtool" \
            -o -name "usymtoolarm64" \) -exec chmod +x {} +
          if [ ! -d "$XCODE_DIR/Unity-iPhone.xcodeproj" ]; then
            echo "ERREUR : $XCODE_DIR/Unity-iPhone.xcodeproj est ABSENT du repo."
            exit 1
          fi
          cd "$XCODE_DIR"
          xcodebuild -version
          xcodebuild -list || true
          # on récupère TOUS les schémas (le premier de la liste n'est
          # pas forcément celui qui produit l'app)
          SCHEMES=$(xcodebuild -list 2>/dev/null \
            | sed -n '/Schemes:/,$p' \
            | grep -v 'Schemes:' \
            | sed 's/^ *//' | grep -v '^$' || true)
          echo "$SCHEMES" > /tmp/schemes.txt
          echo "Schémas disponibles :"
          cat /tmp/schemes.txt

      # --------------------------------------------------------------
      # 2) xcodebuild SANS signature. On essaie chaque schéma jusqu'à
      #    ce qu'un .app soit réellement produit (le schéma
      #    UnityFramework ne sort que des bibliothèques statiques ;
      #    l'app vient du schéma de l'app — Unity-iPhone).
      # --------------------------------------------------------------
      - name: "Compiler l'app (sans signature)"
        script: |
          set -e
          cd "$XCODE_DIR"
          COMMON_FLAGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=\"\""
          APP=""

          check_app() {
            find "$CM_BUILD_DIR/derived/Build/Products" \
              -name "*.app" -type d | head -n 1
          }

          # a) essai cible directe (le plus déterministe avec Unity :
          #    l'app target s'appelle Unity-iPhone, le produit MatterRunner)
          echo "== Tentative : cible directe Unity-iPhone =="
          xcodebuild \
              -project Unity-iPhone.xcodeproj \
              -target Unity-iPhone \
              -configuration Release \
              -sdk iphoneos \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              -derivedDataPath "$CM_BUILD_DIR/derived" \
              build || echo "La cible directe n'a pas fini proprement."
          APP=$(check_app)
          [ -n "$APP" ] && echo "App trouvée après la cible directe : $APP"

          # b) si rien : on boucle sur les schémas réels du projet
          if [ -z "$APP" ]; then
            for s in $(cat /tmp/schemes.txt); do
              echo "== Build du schéma : $s =="
              xcodebuild \
                  -project Unity-iPhone.xcodeproj \
                  -scheme "$s" \
                  -configuration Release \
                  -destination 'generic/platform=iOS' \
                  CODE_SIGNING_ALLOWED=NO \
                  CODE_SIGNING_REQUIRED=NO \
                  CODE_SIGN_IDENTITY="" \
                  -derivedDataPath "$CM_BUILD_DIR/derived" \
                  build || echo "(schéma $s : sortie non nulle, on vérifie l'app)"
              APP=$(check_app)
              if [ -n "$APP" ]; then
                echo "App trouvée via le schéma $s : $APP"
                break
              fi
            done
          fi

          if [ -z "$APP" ]; then
            echo "ERREUR : aucun .app produit après toutes les tentatives."
            find "$CM_BUILD_DIR/derived/Build/Products" || true
            exit 1
          fi
          echo "$APP" > /tmp/app.txt

      # --------------------------------------------------------------
      # 3) Packager l'app non signée en .ipa (Payload/). C'est le
      #    fichier à glisser dans Sideloadly.
      # --------------------------------------------------------------
      - name: "Packager en .ipa"
        script: |
          set -e
          APP=$(cat /tmp/app.txt)
          echo "App : $APP"
          # Unity signe parfois l'app pour "distribution locale" : on
          # retire toute signature pour rester cohérent pour Sideloadly
          codesign --remove-signature "$APP" 2>/dev/null || true
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/ipa/Payload/"
          cd "$CM_BUILD_DIR/ipa"
          zip -qry "$CM_BUILD_DIR/MatterRunner-unsigned.ipa" Payload
          echo "== IPA prête : MatterRunner-unsigned.ipa =="
          ls -la "$CM_BUILD_DIR/MatterRunner-unsigned.ipa"

    # --------------------------------------------------------------
    #  Ce que Codemagic met à disposition en fin de build :
    # --------------------------------------------------------------
    artifacts:
      - "*.ipa"

    publishing: {}