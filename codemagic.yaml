# =====================================================================
#  codemagic.yaml — MatterRunner : build iOS SIMPLIFIÉ (sans Unity)
#
#  NOUVELLE STRATÉGIE (octobre 2026) :
#    - le PROJET XCODE (build_xcode/) est généré PAR TON UNITY WINDOWS
#      (ton PC a déjà la licence Personal) puis poussé sur GitHub ;
#    - les Mac de Codemagic ne font PLUS qu'UNE chose : compiler ce
#      projet avec xcodebuild (aucun Unity, AUCUNE licence Unity) ;
#    - la .ipa sort NON SIGNÉE : tu la fais signer gratuitement par
#      ton Apple ID avec Sideloadly / AltStore sur ton PC, puis tu
#      l'installes sur ton iPhone.
#
#  Déclencheur : bouton "Start build" dans l'onglet Builds de Codemagic.
#  Plus AUCUNE variable d'environnement nécessaire.
# =====================================================================

workflows:
  matterrunner-ios:
    name: "MatterRunner — Xcode → IPA non signée"
    instance_type: "mac_mini_m1"
    max_build_duration: 100

    environment:
      groups:
        - default
      vars:
        XCODE_DIR: "build_xcode"

    scripts:
      # --------------------------------------------------------------
      # 1) Vérifier que le projet Xcode généré par Unity est bien là.
      #    (s'il manque, c'est le build_xcode/ du repo qui n'a pas été
      #     poussé — rien à régler côté Mac)
      # --------------------------------------------------------------
      - name: "Vérifier le projet Xcode"
        script: |
          set -e
          # libiPhone-lib.a est stockée via Git LFS (>100 Mo, refusé par
          # GitHub en Git classique) : on s'assure qu'elle est débloquée.
          git lfs install || true
          git lfs pull || true
          ls -la "$XCODE_DIR/Libraries/" || true
          if [ ! -d "$XCODE_DIR" ]; then
            echo "ERREUR : le dossier $XCODE_DIR est ABSENT du repo."
            echo "Regénère-le sur ton PC (Unity batchmode CiBuild.BuildIos)"
            echo "puis pousse-le sur GitHub."
            exit 1
          fi
          echo "== Contenu de $XCODE_DIR =="
          ls "$XCODE_DIR" | head -20
          [ -d "$XCODE_DIR/Unity-iPhone.xcodeproj" ] \
            || { echo "ERREUR : Unity-iPhone.xcodeproj introuvable"; exit 1; }
          # le schéma existe-t-il ? (Unity le génère normalement)
          cd "$XCODE_DIR"
          xcodebuild -list || true
          SCHEME=$(xcodebuild -list 2>/dev/null | awk '/Targets:/{f=0} /Schemes:/{f=1;next} f{print $1; exit}')
          if [ -z "$SCHEME" ]; then SCHEME="Unity-iPhone"; fi
          echo "Schéma retenu : $SCHEME"
          echo "$SCHEME" > /tmp/scheme.txt

      # --------------------------------------------------------------
      # 2) xcodebuild : compile l'app pour iPhone SANS signature
      #    (CODE_SIGNING_ALLOWED=NO — aucun certificat Apple nécessaire,
      #     la signature sera faite sur TON PC par Sideloadly/AltStore)
      # --------------------------------------------------------------
      - name: "Compiler l'app (sans signature)"
        script: |
          set -e
          cd "$XCODE_DIR"
          SCHEME=$(cat /tmp/scheme.txt)
          # build "generic/platform=iOS" = appareil réel, pas le simulateur
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath "$CM_BUILD_DIR/derived" \
            build || {
            echo '=============================================='
            echo '== xcodebuild a ÉCHOUÉ — dernières erreurs =='
            echo '=============================================='
            exit 1
          }

      # --------------------------------------------------------------
      # 3) Packager l'app non signée en .ipa (structure Payload/). C'est
      #    ce fichier qu'on glisse dans Sideloadly.
      # --------------------------------------------------------------
      - name: "Packager en .ipa"
        script: |
          set -e
          APP=$(find "$CM_BUILD_DIR/derived/Build/Products" -maxdepth 2 \
            -name "*.app" -type d | head -n 1)
          if [ -z "$APP" ]; then
            echo "ERREUR : aucun .app produit !"
            find "$CM_BUILD_DIR/derived/Build" -maxdepth 3 || true
            exit 1
          fi
          echo "App : $APP"
          # Unity signe parfois malgré tout avec "sign to distribute
          # locally" : on retire toute signature pour rester cohérent
          codesign --remove-signature "$APP" 2>/dev/null || true
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/ipa/Payload/"
          cd "$CM_BUILD_DIR/ipa"
          zip -qry "$CM_BUILD_DIR/MatterRunner-unsigned.ipa" Payload
          echo "== IPA prête : MatterRunner-unsigned.ipa =="
          ls -la "$CM_BUILD_DIR/MatterRunner-unsigned.ipa"

    # --------------------------------------------------------------
    #  Ce que Codemagic rend à la fin du build :
    # --------------------------------------------------------------
    artifacts:
      - "*.ipa"

    publishing: {}